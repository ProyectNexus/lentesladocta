<title>Panel Lentes La Docta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Base: lo mínimo para que se vea igual dentro de Google Apps Script */
html, body { margin: 0; padding: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: app de una mano con la identidad de la tienda. Barra superior compacta (marca + actualizar), título grande por sección,
   tarjetas en una columna y barra inferior con botón central "+" para cargar. En compu, la columna se centra a 600px. */
:root {
  --bg: #F3F4F5; --surface: #FFFFFF; --surface-2: #F7F8F8; --ink: #111315; --ink-2: #3A3D42; --muted: #6B7076; --faint: #9AA0A6;
  --line: #E3E5E7; --line-2: #EEF0F1;
  --accent: #C98E0A; --accent-soft: #FBF1DA;
  --s1: #2a78d6;  /* visitas */
  --s2: #eda100;  /* consultas por WhatsApp */
  --good: #1E7A4A; --good-bg: #E3F3EA; --warn: #8A5A00; --warn-bg: #FBF0D6; --bad: #B3261E; --bad-bg: #FBE4E2;
  --veil: rgba(12, 13, 14, .42);
  --shadow: 0 1px 2px rgba(17,19,21,.04), 0 2px 8px rgba(17,19,21,.04);
  --shadow-lg: 0 12px 40px rgba(17,19,21,.18);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 16px; --r-sm: 10px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0D0E; --surface: #151618; --surface-2: #1B1C1F; --ink: #EDEEF0; --ink-2: #C7CACE; --muted: #959AA0; --faint: #6C7177;
  --line: #26282B; --line-2: #1E2023; --accent: #E2A93A; --accent-soft: #2C2310; --s1: #3987e5; --s2: #c98500;
  --good: #5CC08A; --good-bg: #12301F; --warn: #F0B44C; --warn-bg: #33270C; --bad: #F08A80; --bad-bg: #3A1714;
  --veil: rgba(0, 0, 0, .6); --shadow: none; --shadow-lg: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C0D0E; --surface: #151618; --surface-2: #1B1C1F; --ink: #EDEEF0; --ink-2: #C7CACE; --muted: #959AA0; --faint: #6C7177;
  --line: #26282B; --line-2: #1E2023; --accent: #E2A93A; --accent-soft: #2C2310; --s1: #3987e5; --s2: #c98500;
  --good: #5CC08A; --good-bg: #12301F; --warn: #F0B44C; --warn-bg: #33270C; --bad: #F08A80; --bad-bg: #3A1714;
  --veil: rgba(0, 0, 0, .6); --shadow: none; --shadow-lg: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .01em; }
.col { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 20px; height: 20px; flex: none; }

/* Barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar .col { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brandmark { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; line-height: 1; }
/* Logo: LENTES / — LA — / D(lente)CTA. Todo se escala con font-size. */
.logo3 { display: inline-flex; flex-direction: column; align-items: center; gap: .12em; font-family: var(--f-display, "Archivo", sans-serif); font-weight: 800; font-stretch: 100%; line-height: .88; text-transform: uppercase; letter-spacing: 0; white-space: nowrap; color: inherit; }
.logo3 b { display: flex; align-items: center; font-weight: 800; font-size: 1em; letter-spacing: 0; margin: 0; }
.logo3 i { display: flex; align-items: center; gap: .38em; font-style: normal; font-weight: 700; font-size: .7em; letter-spacing: .12em; padding-left: .12em; line-height: 1; }
.logo3 i s { display: block; width: 1.05em; height: max(1.5px, .095em); background: currentColor; text-decoration: none; }
.logo3 .lo { width: .8em; height: .8em; margin: 0 .02em; flex: none; }
.brandmark .logo3 { font-size: 12px; }
@media (max-width: 420px) { .upd { display: none; } }
.bar .mini { font-weight: 600; font-size: 15px; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar.scrolled .mini { opacity: 1; transform: none; }
.bar.scrolled .brandmark { display: none; }
.bar .sp { flex: 1; }
.upd { font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.25; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
.back { border: 0; background: none; width: 36px; margin-left: -8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.demo { font-size: 12.5px; color: var(--warn); background: var(--warn-bg); }
.demo .col { padding-block: 8px; display: flex; gap: 8px; align-items: center; }
.demo .col::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* Título de sección */
.head { padding: 10px 0 2px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-weight: 600; font-size: 30px; letter-spacing: -.02em; line-height: 1.08; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.head .act { flex: none; }

main { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 12px; padding-block: 4px 12px; animation: fade .25s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
h2 { font-size: 16px; font-weight: 700; margin: 14px 0 -2px; letter-spacing: -.005em; display: flex; justify-content: space-between; align-items: baseline; }
h2 small { font-weight: 500; color: var(--muted); font-size: 13px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.box { background: var(--surface); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
.box.flush { padding: 4px 16px; }
.hero-n { font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: -.025em; }
.sub { color: var(--muted); font-size: 13px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); font-size: 14px; min-width: 0; }
.row:first-child { border-top: 0; }
.row > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row b { font-weight: 600; }
.neg { color: var(--bad) !important; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.tile > span:first-child { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile b { display: block; font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 24px; line-height: 1.15; letter-spacing: -.02em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small { font-size: 12px; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); background: var(--good-bg); }
.delta.down { color: var(--bad); background: var(--bad-bg); }
.delta.flat { color: var(--muted); background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.rep { color: var(--warn); background: var(--warn-bg); }
.pill.sin { color: var(--bad); background: var(--bad-bg); }
.pill.off { color: var(--muted); background: var(--surface-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; margin: 0; }
.more { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none; padding: 12px 0 2px; border-top: 1px solid var(--line-2); margin-top: 8px; font-weight: 600; font-size: 14px; color: var(--ink); }
.more svg { width: 16px; height: 16px; color: var(--muted); }

/* Inicio */
.balance { display: flex; flex-direction: column; gap: 4px; }
.balance .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
.balance .hero-n { font-size: 42px; margin: 2px 0 2px; }
.flows { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.flows b { color: var(--ink); font-weight: 600; }
.medios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.medio { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.medio .ic { grid-row: span 2; width: 32px; height: 32px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.medio .ic svg { width: 16px; height: 16px; }
.medio span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.medio b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-h .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
.card-h .val { font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats3 > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats3 span { font-size: 12px; color: var(--muted); }
.stats3 b { font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 24px; letter-spacing: -.02em; }
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line-2); min-width: 0; }
.lrow:first-child { border-top: 0; }
.lrow .ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); overflow: hidden; font-size: 12px; font-weight: 700; }
.lrow .ic svg { width: 17px; height: 17px; }
.lrow .ic img { width: 100%; height: 100%; object-fit: cover; }
.lrow .t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 2; }
.lrow .r { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 14px; font-weight: 600; }
.lrow .r small { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Segmentado */
.seg { display: flex; background: var(--line-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 38px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* Gráficos */
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { position: relative; margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line-2); stroke-width: 1; }
.chart .grid line.base { stroke: var(--line); }
.chart text { fill: var(--faint); font-size: 10px; font-family: var(--f-mono); }
.chart .hit { fill: transparent; }
.chart .sel { fill: var(--ink); fill-opacity: .06; }
.chart .bar-v { fill: var(--ink); }
.chart .bar-v.today { fill: var(--accent); }
.chart .bar-z { fill: var(--line); }
.tip { position: absolute; top: -8px; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: var(--shadow-lg); z-index: 2; }
.tip b { font-weight: 700; }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* Barras horizontales */
.hbars { display: flex; flex-direction: column; gap: 12px; }
.hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: baseline; font-size: 14px; }
.hb > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb b { font-weight: 600; }
.hb .track { grid-column: 1 / -1; height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.hb .fill { height: 100%; border-radius: 3px; background: var(--s1); min-width: 2px; }
.hb .fill.wa { background: var(--s2); }
.hb small { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 500; }

/* Formularios */
form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, textarea, .search input { width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, textarea:focus, .search input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
textarea { resize: vertical; line-height: 1.45; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; min-height: 38px; transition: background .15s, color .15s, border-color .15s; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; min-height: 48px; }
.stepper button { width: 48px; align-self: stretch; border: 0; background: none; font-size: 20px; color: var(--ink-2); }
.stepper input { border: 0 !important; text-align: center; background: none !important; min-height: 0 !important; padding: 0 !important; flex: 1; min-width: 0; box-shadow: none !important; font-weight: 600; }
.preview { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.preview b { font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 26px; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 16px; min-height: 52px; padding: 12px 18px; width: 100%; transition: opacity .15s, transform .1s; }
.btn:active { transform: scale(.99); }
.btn:disabled { opacity: .45; cursor: progress; }
.btn.dark { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: none; color: var(--bad); border: 0; min-height: 44px; font-size: 15px; }
.msg { font-size: 14px; color: var(--bad); min-height: 0; margin: 0; }
.msg:empty { display: none; }
.form-foot { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); margin: 4px -16px -16px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--line-2); border-radius: 0 0 var(--r) var(--r); display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.form-foot .sub { text-align: center; margin: 0; }

/* Stock */
.search { position: relative; }
.search input { padding-left: 42px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
.plist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.pitem + .pitem { border-top: 1px solid var(--line-2); }
.phead { width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 2px 12px; text-align: left; background: none; border: 0; padding: 12px 14px; align-items: center; }
.phead[aria-expanded="true"] { background: var(--surface-2); }
.phead .nm { grid-column: 2; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .meta { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .right { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.phead .stk { font-family: var(--f-display); font-stretch: 105%; font-weight: 600; font-size: 20px; line-height: 1; letter-spacing: -.02em; }
.phead .stk small { font-family: var(--f-body); font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); display: grid; place-items: center; overflow: hidden; color: var(--faint); grid-row: 1 / span 2; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 20px; height: 20px; }
.pedit { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 14px; background: var(--surface-2); border-top: 1px solid var(--line-2); }
.pedit .field input, .pedit textarea, .pedit .stepper { background: var(--surface); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 500; min-height: 44px; }
.switch input { width: 48px; height: 28px; appearance: none; background: var(--line); border-radius: 999px; position: relative; transition: background .2s; flex: none; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked { background: var(--good); }

/* Ventas por día (últimos 14) */
function salesSVG(dias) {
  if (!dias.length) return '<p class="empty">Sin datos todavía.</p>';
  const W = 340, H = 150, top = 10, bot = 20, left = 0, right = 0;
  const max = Math.max(1, ...dias.map(x => x.total));
  const pow = Math.pow(10, Math.floor(Math.log10(max))), step = Math.ceil(max / 3 / pow) * pow, ymax = step * 3;
  const y = v => top + (H - top - bot) * (1 - v / ymax);
  const n = dias.length, bw = (W - left - right) / n, gap = 5, r = Math.min(4, (bw - gap) / 2);
  const hoy = new Date(); const kHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
  const bar = (x, w, v, cls) => {
    const yy = v > 0 ? y(v) : y(0) - 2;
    const rr = Math.min(r, (y(0) - yy) / 2);
    return `<path class="${cls}" d="M${x},${y(0)} V${yy + rr} q0,-${rr} ${rr},-${rr} h${w - 2 * rr} q${rr},0 ${rr},${rr} V${y(0)} Z"/>`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día, últimos ${n} días">
    <g class="grid">${[1, 2, 3].map(k => `<line x1="0" x2="${W}" y1="${y(step * k)}" y2="${y(step * k)}"/>`).join('')}<line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></g>
    ${dias.map((x, i) => {
      const bx = left + i * bw + gap / 2, w = bw - gap;
      const lab = (i % 3 === 0 && n - 1 - i >= 2) || i === n - 1 ? `<text x="${bx + w / 2}" y="${H - 5}" text-anchor="middle">${+x.dia.slice(8)}</text>` : '';
      return `<g data-i="${i}"><rect class="sel" x="${bx - gap / 2}" y="${top}" width="${bw}" height="${H - top - bot}" opacity="0"/>${bar(bx, w, x.total, x.total > 0 ? (x.dia === kHoy ? 'bar-v today' : 'bar-v') : 'bar-z')}${lab}<rect class="hit" x="${bx - gap / 2}" y="0" width="${bw}" height="${H}"/></g>`;
    }).join('')}
    <text x="${W}" y="${y(ymax) - 2}" text-anchor="end">${compact(ymax).replace('$ ', '$')}</text></svg>`;
}
function wireSales() {
  const ch = $('#sales'); if (!ch) return;
  const dias = S.data.ventasDias || [];
  const show = g => {
    ch.querySelectorAll('.sel').forEach(r => r.setAttribute('opacity', 0));
    const old = ch.querySelector('.tip'); if (old) old.remove();
    if (!g) return;
    const x = dias[+g.dataset.i]; g.querySelector('.sel').setAttribute('opacity', 1);
    const rect = g.querySelector('.hit').getBoundingClientRect(), box = ch.getBoundingClientRect();
    const tip = document.createElement('div'); tip.className = 'tip';
    tip.innerHTML = `<b>${new Date(x.dia + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })}</b><br>${money(x.total)}${x.n ? ` · ${x.n} ${x.n === 1 ? 'venta' : 'ventas'}` : ''}`;
    tip.style.left = Math.min(Math.max(rect.left - box.left + rect.width / 2, 64), box.width - 64) + 'px';
    tip.style.top = '18px';
    ch.appendChild(tip);
  };
  ch.addEventListener('pointerover', e => show(e.target.closest('[data-i]')));
  ch.addEventListener('pointerdown', e => show(e.target.closest('[data-i]')));
  ch.addEventListener('pointerleave', () => show(null));
}

function hbars(items, max, cls, extra) {
  return `<div class="hbars">${items.map(it => `<div class="hb"><span>${esc(it.label)}</span><b class="num">${it.n}${extra ? extra(it) : ''}</b><div class="track"><div class="fill ${cls || ''}" style="width:${max ? Math.max(2, it.n / max * 100) : 0}%"></div></div></div>`).join('')}</div>`;
}

function chartSVG(serie) {
  const W = 340, H = 170, top = 14, bot = 22, left = 26, right = 4;
  const max = Math.max(4, ...serie.map(s => s.visitas));
  const step = Math.ceil(max / 4), ymax = step * 4;
  const y = v => top + (H - top - bot) * (1 - v / ymax);
  const n = serie.length, bw = (W - left - right) / n, gap = n > 14 ? 1.5 : 3;
  const ticks = [0, step, step * 2, step * 3, ymax];
  const every = n > 14 ? 5 : 1;
  const r = Math.min(4, (bw - gap) / 2);
  const bar = (x, w, v, color) => v > 0 ? `<path d="M${x},${y(0)} V${y(v) + r} q0,-${r} ${r},-${r} h${w - 2 * r} q${r},0 ${r},${r} V${y(0)} Z" fill="${color}"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas y consultas por día">
    <g class="grid">${ticks.map(t => `<line x1="${left}" x2="${W - right}" y1="${y(t)}" y2="${y(t)}"/><text x="${left - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}</g>
    ${serie.map((s, i) => {
      const x = left + i * bw + gap / 2, w = bw - gap, wi = Math.max(2, w * 0.5);
      const lab = i % every === 0 || i === n - 1 ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${s.dia.slice(8)}</text>` : '';
      return `<g data-i="${i}"><rect class="sel" x="${x - gap / 2}" y="${top}" width="${bw}" height="${H - top - bot}" opacity="0"/>${bar(x, w, s.visitas, 'var(--s1)')}${bar(x + (w - wi) / 2, wi, s.wa, 'var(--s2)')}${lab}<rect class="hit" x="${x - gap / 2}" y="0" width="${bw}" height="${H}"/></g>`;
    }).join('')}</svg>`;
}

function wireChart() {
  const ch = $('#chart'); if (!ch) return;
  const serie = S.data.trafico[S.rango].serie;
  const show = g => {
    ch.querySelectorAll('.sel').forEach(r => r.setAttribute('opacity', 0));
    let tip = ch.querySelector('.tip'); if (tip) tip.remove();
    if (!g) return;
    const i = +g.dataset.i, s = serie[i];
    g.querySelector('.sel').setAttribute('opacity', 1);
    const rect = g.querySelector('.hit').getBoundingClientRect(), box = ch.getBoundingClientRect();
    const fecha = new Date(s.dia + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
    tip = document.createElement('div'); tip.className = 'tip';
    tip.innerHTML = `<b>${fecha}</b><br><i style="background:var(--s1)"></i>${s.visitas} visitas<br><i style="background:var(--s2)"></i>${s.wa} consultas`;
    const cx = Math.min(Math.max(rect.left - box.left + rect.width / 2, 60), box.width - 60);
    tip.style.left = cx + 'px'; tip.style.top = '24px';
    ch.appendChild(tip);
  };
  ch.addEventListener('pointerover', e => show(e.target.closest('[data-i]')));
  ch.addEventListener('pointerdown', e => show(e.target.closest('[data-i]')));
  ch.addEventListener('pointerleave', () => show(null));
}

  <form class="box" id="fVenta">
    <div class="field"><label for="vProd">Producto</label><select id="vProd">${grupos.map(g => { const l = disponibles.filter(x => x.categoria === g); return l.length ? `<optgroup label="${g}">${l.map(x => `<option value="${x.id}" ${x.id === v.id ? 'selected' : ''}>${esc(x.nombre)} · ${x.stock} en stock</option>`).join('')}</optgroup>` : ''; }).join('')}</select></div>

    </div>

    <div class="field"><label for="vEnv">Envío</label><select id="vEnv"><option value="">Sin envío (retira o ya cargado)</option>${env.opciones.map((o, i) => `<option value="${i}" ${String(v.envio) === String(i) ? 'selected' : ''}>${esc(o.zona)} · ${esc(o.opcion)} · ${money(o.precio)}</option>`).join('')}</select></div>
    ${v.envio !== '' ? `<div class="two">
      <div class="field"><label for="vEnvCob">Le cobraste</label><input id="vEnvCob" type="number" inputmode="numeric" min="0" value="${esc(v.envCob)}"></div>
      <div class="field"><label for="vEnvCos">Te costó</label><input id="vEnvCos" type="number" inputmode="numeric" min="0" value="${esc(v.envCos)}"></div>
    </div><div class="opts"><button type="button" data-venv="gratis">Fue gratis para el cliente</button></div>` : ''}
    <div class="preview"><span>${p ? `Precio vigente ${money(p.precioVigente)}${p.precioVigente < p.precioFinal ? ' (con promo)' : ''}${v.envio !== '' ? ' + envío' : ''}` : 'Elegí un producto'}</span><b class="num" id="vTotal">${money(total)}</b></div>
    <div class="field"><span class="lbl">Medio de pago</span>${opts(MEDIOS, v.medio, 'venta.medio')}</div>
    <div class="field"><span class="lbl">Canal</span>${opts(CANALES, v.canal, 'venta.canal')}</div>
    <div class="two">
      <div class="field"><label for="vCli">Cliente</label><input id="vCli" type="text" autocomplete="off" value="${esc(v.cliente)}" placeholder="Opcional"></div>

  <form class="box" id="fMov">
    <div class="field"><span class="lbl">Tipo</span>${opts(['Egreso', 'Ingreso'], m.tipo, 'mov.tipo')}</div>
    <div class="field"><label for="mCat">Categoría</label><select id="mCat">${CATS_CAJA.map(c => `<option ${c === m.categoria ? 'selected' : ''}>${c}</option>`).join('')}</select></div>

function ventaTotal() {
  const v = S.venta, p = S.data.productos.find(x => x.id === v.id);
  if (!p) return 0;
  const bruto = p.precioVigente * (v.cantidad || 1);
  return (v.gratis2x1 ? 0 : bruto - (Number(v.descuento) || 0)) + (v.envio !== '' ? Number(v.envCob) || 0 : 0);
}
function syncVenta() {
  if (!$('#fVenta')) return;
  const v = S.venta;
  v.id = $('#vProd').value; v.cantidad = Math.max(1, parseInt($('#vCant').value, 10) || 1);
  v.descuento = $('#vDesc').value; v.cliente = $('#vCli').value; v.telefono = $('#vTel').value;
  v.gratis2x1 = $('#v2x1') ? $('#v2x1').checked : false;
  if ($('#vEnvCob')) { v.envCob = $('#vEnvCob').value; v.envCos = $('#vEnvCos').value; }
}
function wireForms() {
  const fv = $('#fVenta'), fm = $('#fMov');
  if (fv) {
    const sync = () => { syncVenta(); const t = money(ventaTotal()); $('#vTotal').textContent = t; if ($('#vBtnTot')) $('#vBtnTot').textContent = t; };
    $('#vProd').addEventListener('change', () => { sync(); render(); });
    $('#vEnv').addEventListener('change', e => {
      sync(); S.venta.envio = e.target.value;
      const o = (S.data.envios.opciones || [])[+e.target.value];
      if (o) { S.venta.envCob = (S.data.campana || {}).envioGratis && o.gratis ? 0 : o.precio; S.venta.envCos = o.costo || o.precio; } else { S.venta.envCob = ''; S.venta.envCos = ''; }
      render();
    });
    if ($('#v2x1')) $('#v2x1').addEventListener('change', sync);
    fv.addEventListener('input', sync);
    fv.addEventListener('submit', async e => {
      e.preventDefault(); sync();
      $('#vBtn').disabled = true; $('#vMsg').textContent = '';
      try {
        const v = S.venta, o = v.envio !== '' ? S.data.envios.opciones[+v.envio] : null;
        const r = await call('panelVenta', { ...v, descuento: Number(v.descuento) || 0,
          envio: o ? { detalle: o.zona + ' · ' + o.opcion + (Number(v.envCob) ? '' : ' (gratis)'), cobrado: Number(v.envCob) || 0, costo: Number(v.envCos) || 0 } : null });
        toast(`Venta ${r.numero} registrada · ${money(r.total)}`);
        S.venta = { ...S.venta, cantidad: 1, descuento: '', gratis2x1: false, envio: '', envCob: '', envCos: '', cliente: '', telefono: '' };
        await cargar();
      } catch (x) { $('#vMsg').textContent = x.message; $('#vBtn').disabled = false; }
    });
  }
  if (fm) {
    const sync = () => { S.mov.categoria = $('#mCat').value; S.mov.monto = $('#mMonto').value; S.mov.detalle = $('#mDet').value; };
    fm.addEventListener('input', sync); fm.addEventListener('change', sync);
    fm.addEventListener('submit', async e => {
      e.preventDefault(); sync();
      if (!(Number(S.mov.monto) > 0)) { $('#mMsg').textContent = 'Poné un monto mayor a 0.'; return; }
      $('#mBtn').disabled = true;
      try {
        const r = await call('panelMovimiento', { ...S.mov, monto: Number(S.mov.monto) });
        toast(`${r.tipo} de ${money(r.monto)} registrado`);
        S.mov = { ...S.mov, monto: '', detalle: '' };
        await cargar();
      } catch (x) { $('#mMsg').textContent = x.message; $('#mBtn').disabled = false; }
    });
  }
}

/* Fotos: se achican en el celular antes de subirlas (máx. 1400 px, JPG) */
async function achicar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No pude leer esa imagen.')); i.src = url; });
    const k = Math.min(1, 1400 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .85);
  } finally { URL.revokeObjectURL(url); }
}
async function sumarFotos(files, lista) {
  for (const f of [...files].slice(0, 3 - lista.length)) {
    try { lista.push(await achicar(f)); } catch (x) { toast(x.message); }
  }
}

      data.productos.push({ id, nombre: d.nombre, categoria: d.categoria, precioLista: d.lista, descuento: d.desc, precioFinal, precioVigente: Math.round(precioFinal * .9 / 100) * 100, costo: d.costo, stock: d.stock, estado: d.stock <= 0 ? 'SIN STOCK' : d.stock <= d.minimo ? 'REPONER' : 'OK', publicar: d.publicar, destacado: d.destacado, imagen: fotos[0] || '', descripcion: d.descripcion });
      return { id };
    },
    panelProducto: (id, c) => { const p = data.productos.find(x => x.id === id); if (c.nombre) p.nombre = c.nombre; p.descripcion = c.descripcion; if (c.frase != null) p.frase = c.frase; if (c.mLente != null) p.medidas = { lente: +c.mLente || 0, puente: +c.mPuente || 0, patilla: +c.mPatilla || 0 }; if (c.fotos && c.fotos.length) p.imagen = c.fotos[0]; p.precioLista = c.precioLista; p.descuento = c.descuento; p.precioFinal = Math.round(c.precioLista * (1 - c.descuento) / 100) * 100; p.precioVigente = Math.round(p.precioFinal * .9 / 100) * 100; p.publicar = c.publicar; p.destacado = c.destacado; p.stock += c.sumarStock; p.estado = p.stock <= 0 ? 'SIN STOCK' : p.stock <= 2 ? 'REPONER' : 'OK'; return true; },
  };
})();

  try { S.clave = localStorage.getItem('lu_clave') || ''; } catch (e) {}
  if (S.clave) cargar(); else renderLogin();
} else {
  $('#demo').hidden = false;
  cargar();
}
</script>
